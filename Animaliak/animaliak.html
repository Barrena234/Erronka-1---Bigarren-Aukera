        <article class="animalien-txartela">
          <button class="animalien-botoia" type="button" data-animalia="nala">

          </button>
        </article>
        <article class="animalien-txartela">
          <button class="animalien-botoia" type="button" data-animalia="rocky">
            <img src="Argazkiak/Perro1.png" alt="Rocky, txakur mestizoa">
            <span>Rocky</span>
          </button>
        </article>
        <article class="animalien-txartela">
          <button class="animalien-botoia" type="button" data-animalia="kira">
            <img src="Argazkiak/Perro2.png" alt="Kira, artzain alemaniarra">
            <span>Kira</span>
          </button>
        </article>
        <article class="animalien-txartela">
          <button class="animalien-botoia" type="button" data-animalia="toby">
            <img src="Argazkiak/Perro3.png" alt="Toby, beagle txakurra">

          </button>
        </article>
        <article class="animalien-txartela">
          <button class="animalien-botoia" type="button" data-animalia="rio">
            <img src="Argazkiak/Loro.png" alt="Río, loro berdea">
            <span>Río</span>
          </button>
        </article>
        <article class="animalien-txartela">
          <button class="animalien-botoia" type="button" data-animalia="paco">
            <img src="Argazkiak/Periquito.png" alt="Paco, perikito urdina">
            <span>Paco</span>
          </button>
        </article>
        <article class="animalien-txartela">
          <button class="animalien-botoia" type="button" data-animalia="sol">
            <img src="Argazkiak/Canario.png" alt="Sol, kanario horia">

          </button>
